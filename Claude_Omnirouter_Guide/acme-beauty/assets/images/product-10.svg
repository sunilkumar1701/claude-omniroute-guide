<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#F9E5E0"/><stop offset="100%" style="stop-color:#FFF7F6"/></linearGradient></defs>
  <rect width="400" height="500" fill="url(#bg10)"/>
  <circle cx="100" cy="120" r="70" fill="#FCE8E3" opacity="0.6"/>
  <circle cx="300" cy="280" r="85" fill="#FCE8E3" opacity="0.5"/>

  <!-- Sunscreen bottle -->
  <rect x="145" y="120" width="110" height="160" rx="12" fill="#F5D4D4"/>
  <rect x="160" y="100" width="80" height="28" rx="6" fill="#E8A5A5"/>
  <rect x="180" y="80" width="40" height="22" rx="4" fill="#D68B99"/>

  <!-- SPF indicator label -->
  <rect x="155" y="180" width="90" height="50" rx="5" fill="white" opacity="0.85"/>
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#F58D96">SPF</text>
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#F58D96">50</text>

  <!-- Sun protection glow -->
  <circle cx="200" cy="160" r="55" fill="#F58D96" opacity="0.08"/>

  <text x="200" y="310" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#252525">Daily Glow</text>
  <text x="200" y="335" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#252525">Sunscreen SPF 50</text>
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F58D96" font-weight="bold">Sun Care</text>
  <text x="200" y="455" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#F58D96">★★★★☆</text>
</svg>