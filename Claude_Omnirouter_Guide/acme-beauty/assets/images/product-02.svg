<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9E5E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF7F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg2)"/>
  <circle cx="80" cy="120" r="70" fill="#FCE8E3" opacity="0.8"/>
  <circle cx="320" cy="250" r="90" fill="#FCE8E3" opacity="0.6"/>

  <!-- Cream jar -->
  <ellipse cx="200" cy="140" rx="70" ry="15" fill="#F5D7DB"/>
  <rect x="130" y="140" width="140" height="120" rx="20" fill="#F8D4DC"/>
  <ellipse cx="200" cy="260" rx="70" ry="15" fill="#F0C1CC"/>
  <rect x="150" y="110" width="100" height="20" fill="#E8A5A5"/>

  <!-- Cream inside (texture) -->
  <ellipse cx="200" cy="155" rx="60" ry="12" fill="#FCE8E3" opacity="0.7"/>

  <!-- Shine effect -->
