  <text x="200" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#252525">Vitamin C</text>
  <text x="200" y="335" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#252525">Glow Serum</text>
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F58D96" font-weight="bold">Brightening</text>
  <text x="200" y="455" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#F58D96">★★★★★</text>
</svg>