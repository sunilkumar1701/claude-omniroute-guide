<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF7F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg3)"/>
  <circle cx="200" cy="100" r="85" fill="#FCE8E3" opacity="0.7"/>

  <!-- Serum bottle with dropper -->
  <rect x="160" y="150" width="80" height="140" rx="8" fill="#F5B3C1"/>
  <rect x="175" y="135" width="50" height="20" fill="#E8A5A5"/>
  <circle cx="200" cy="128" r="6" fill="#D68B99"/>
  <line x1="200" y1="128" x2="200" y2="150" stroke="#E8A5A5" stroke-width="2"/>

  <!-- Liquid inside -->
  <rect x="165" y="180" width="70" height="100" fill="#FFD4DD" opacity="0.8"/>

  <!-- Shine -->
