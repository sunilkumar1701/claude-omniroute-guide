<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9E5E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FCE8E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF7F6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="productGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFB3C1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F58D96;stop-opacity:0.1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="150" r="80" fill="url(#productGradient)" opacity="0.6"/>
  <circle cx="300" cy="100" r="60" fill="url(#productGradient)" opacity="0.4"/>
  <circle cx="250" cy="350" r="70" fill="url(#productGradient)" opacity="0.5"/>

  <!-- Product bottle -->
  <rect x="140" y="120" width="120" height="180" rx="10" fill="#F58D96" opacity="0.9"/>
  <rect x="130" y="100" width="140" height="25" rx="5" fill="#E8A5A5"/>
  <rect x="160" y="80" width="80" height="25" rx="5" fill="#D68B99"/>

  <!-- Highlight on bottle -->
  <rect x="155" y="140" width="25" height="100" rx="5" fill="white" opacity="0.3"/>

  <!-- Label on bottle -->
  <rect x="150" y="170" width="100" height="50" fill="white" opacity="0.8" rx="3"/>
  <circle cx="200" cy="195" r="8" fill="#F58D96" opacity="0.6"/>

  <!-- Text -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#252525">Rose Glow</text>
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#252525">Face Serum</text>
  <text x="200" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F58D96" font-weight="bold">Premium Quality</text>

  <!-- Rating stars -->
  <text x="200" y="455" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#F58D96">★★★★★</text>
</svg>